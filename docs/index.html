<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部CSS样式文件，结构与样式分离 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 名片卡片容器 -->
    <div class="card">
        <!-- 圆形头像区域 -->
        <div class="avatar"></div>
        <!-- 姓名 -->
        <h2 class="user-name">李明</h2>
        <!-- 职位 -->
        <p class="user-job">计算机专升本 · 开发实习生</p>
        <!-- 分割线 -->
        <hr class="divider">
        <!-- 联系方式模块 -->
        <div class="contact-info">
            <p>📱 电话：135-1234-5678</p>
            <p>📧 邮箱：liming@example.com</p>
        </div>
        <!-- 技能模块 -->
        <div class="skills">
            <h3>技能</h3>
            <ul>
                <li>HTML/CSS/JavaScript</li>
                <li>Python编程</li>
                <li>数据分析与可视化</li>
            </ul>
        </div>
    </div>
</body>
</html>
